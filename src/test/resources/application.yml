spring:
  jpa:
    open-in-view: false
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

server:
  domain: http://localhost:8080

oauth:
  kakao:
    client-id: test-id
    client-secret: test-secret
    grant-type: authorization_code
    redirect-uri: test-uri

jwt:
  secret: testtesttesttesttesttesttesttesttesttesttesttesttesttesttesttesttest
  access-token-expiration: 1209600000
  refresh-token-expiration: 2419200000

openai:
  key: test-key
  text-generation:
    endpoint: test
    model: gpt-4o-mini

sticker-model:
  endpoint: abc

cloud:
  aws:
    credentials:
      access-key: abc
      secret-key: abc
    region:
      static: abc
    s3:
      bucket: abc
